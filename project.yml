name: OATSchedule
options:
  bundleIdPrefix: ru.oat
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0
targets:
  OATSchedule:
    type: application
    platform: iOS
    sources: [Sources/OATSchedule]
    dependencies:
      - package: SwiftSoup
    preBuildScripts:
      - name: Generate App Icon
        script: bash "$SRCROOT/scripts/generate-app-icon.sh"
        outputFiles:
          - $(SRCROOT)/Sources/OATSchedule/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.oat.schedule
        PRODUCT_NAME: OATSchedule
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
    info:
      path: OATSchedule/Info.plist
      properties:
        CFBundleDisplayName: ОмАВИАТ Расписание
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: ru.oat.schedule
            CFBundleURLSchemes:
              - omaviat
  OATScheduleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/OATScheduleTests]
    resources:
      - Tests/OATScheduleTests/Fixtures
    dependencies:
      - target: OATSchedule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.oat.schedule.tests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
