name: iOS build and IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package iOS app
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project OATSchedule.xcodeproj -scheme OATSchedule

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | /usr/bin/python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d["name"].startswith("iPhone") and d["isAvailable"]]; print(devices[0]["udid"] if devices else "")')"
          if [[ -z "$DEVICE_ID" ]]; then
            echo "No available iPhone simulator on this runner." >&2
            exit 1
          fi
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: >-
          xcodebuild test
          -project OATSchedule.xcodeproj
          -scheme OATSchedule
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}'
          -resultBundlePath "$RUNNER_TEMP/OATSchedule.xcresult"

      - name: Archive unsigned iOS app
        run: >-
          xcodebuild archive
          -project OATSchedule.xcodeproj
          -scheme OATSchedule
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/OATSchedule.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA for eSign
        shell: bash
        run: |
          set -euo pipefail
          IPA_DIR="$RUNNER_TEMP/ipa"
          mkdir -p "$IPA_DIR/Payload"
          ditto "$RUNNER_TEMP/OATSchedule.xcarchive/Products/Applications/OATSchedule.app" "$IPA_DIR/Payload/OATSchedule.app"
          (cd "$IPA_DIR" && /usr/bin/zip -qry OATSchedule.ipa Payload)
          test -s "$IPA_DIR/OATSchedule.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: OATSchedule-unsigned-IPA-${{ github.sha }}
          path: ${{ runner.temp }}/ipa/OATSchedule.ipa
          if-no-files-found: error
          retention-days: 14

